# Desktop-Hülle (Connector) von OpenAgenticOffice für Windows und macOS.
# Eigenes Paket, nicht Teil des Haupt-Workspaces (kein WebView im Server-/WASM-Build).
[package]
name = "open-agentic-office-desktop"
description = "Connector und Desktop-Hülle: startet den Server, verbindet mit Lobbys, öffnet das Office."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Luna-OS/OpenAgenticOffice"

[[bin]]
name = "open-agentic-office-desktop"
path = "src/main.rs"

[dependencies]
tao = "0.34"
wry = "0.53"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
