name: Release

# Jede Änderung auf main wird gebaut und als GitHub-Release veröffentlicht; install.sh und install.ps1
# installieren die neueste. Die Version ist Major.Minor aus der Cargo.toml des Workspaces plus die Zahl
# der Commits auf main (v0.1.68, v0.1.69, …). Für ein neues Minor die Version in Cargo.toml erhöhen.
#
# Pull Requests bauen dasselbe und starten den fertigen Server als Probe, veröffentlichen aber nichts.
# Jedes Archiv enthält: open-agentic-office (Server), office-agenten (CLI), office-pty-wirt (Terminal-Wirt) und dist/ (Browser-Client).
#
# Auf main kommen ins selbe Release auch die Installer der Desktop-App: OpenAgenticOffice-Setup-<version>.exe
# (windows-app.yml) und OpenAgenticOffice-<version>-mac-{arm64,x64}.dmg (mac-app.yml). So steht im neuesten
# Release oben, was man zum Installieren braucht; die Archive sind für install.sh und install.ps1.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'desktop/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows-app.yml'
      - '.github/workflows/mac-app.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-latest, ziel: x86_64-unknown-linux-gnu, endung: tar.gz }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, ziel: aarch64-unknown-linux-gnu, endung: tar.gz }
          - { name: macos-arm64, runner: macos-latest, ziel: aarch64-apple-darwin, endung: tar.gz }
          - { name: macos-x64, runner: macos-latest, ziel: x86_64-apple-darwin, endung: tar.gz }
          - { name: windows-x64, runner: windows-latest, ziel: x86_64-pc-windows-msvc, endung: zip }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # die Version zählt die Commits auf main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.ziel }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Browser-Client bauen (dist/)
        working-directory: crates/client
        run: trunk build --release

      - name: Server und Agenten-CLI bauen
        run: cargo build --release --locked -p server -p agenten --target ${{ matrix.ziel }}

      - name: Archiv packen
        id: packen
        run: |
          basis="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([0-9]+\.[0-9]+).*/\1/')"
          version="$basis.$(git rev-list --count HEAD)"
          exe=""; [ "${{ matrix.runner }}" = windows-latest ] && exe=".exe"
          ordner="paket/open-agentic-office"
          mkdir -p "$ordner"
          cp "target/${{ matrix.ziel }}/release/open-agentic-office$exe" "$ordner/"
          for b in office-agenten office-pty-wirt; do cp "target/${{ matrix.ziel }}/release/$b$exe" "$ordner/" 2>/dev/null || echo "Hinweis: $b nicht gebaut"; done
          cp -R dist "$ordner/dist"
          archiv="open-agentic-office-${{ matrix.name }}.${{ matrix.endung }}"
          if [ "${{ matrix.endung }}" = zip ]; then
            (cd paket && 7z a -tzip "../$archiv" open-agentic-office > /dev/null)
          else
            tar -czf "$archiv" -C paket open-agentic-office
          fi
          echo "$version" > version.txt
          echo "archiv=$archiv" >> "$GITHUB_OUTPUT"

      - name: Probe - den gepackten Server starten
        # Das Intel-Mac-Archiv wird auf einem Apple-Silicon-Runner gebaut und nicht gestartet.
        if: matrix.name != 'macos-x64'
        run: |
          exe=""; [ "${{ matrix.runner }}" = windows-latest ] && exe=".exe"
          "paket/open-agentic-office/open-agentic-office$exe" --host 127.0.0.1 --port 4700 --no-open --daten "$RUNNER_TEMP/office" > office.log 2>&1 &
          office=$!
          code=000
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/ || true)
            [ "$code" != 000 ] && break
            sleep 1
          done
          cat office.log
          kill "$office" || true
          [ "$code" != 000 ] || { echo "Der Server hat nicht geantwortet"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.packen.outputs.archiv }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux-x64'
        with:
          name: version
          path: version.txt

  # Die Installer der Desktop-App, nur für das Release (in Pull Requests prüfen die beiden Workflows sich selbst).
  windows:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/windows-app.yml

  mac:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/mac-app.yml

  veroeffentlichen:
    needs: [bauen, windows, mac]
    # Ein Installer, der nicht baut, hält das Release der Archive (install.sh, install.ps1) nicht auf.
    if: ${{ !cancelled() && needs.bauen.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefakte
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          tag="v$(cat artefakte/version.txt)"
          version="${tag#v}"
          # Die Installer der Desktop-App und die Archive.
          dateien=(artefakte/OpenAgenticOffice-* artefakte/open-agentic-office-*)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag ist schon veröffentlicht: lade fehlende Dateien nach"
            gh release upload "$tag" "${dateien[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          hinweis="**Installieren:** Windows: \`OpenAgenticOffice-Setup-$version.exe\` · Mac: \`OpenAgenticOffice-$version-mac-arm64.dmg\` (Apple-Chip) oder \`OpenAgenticOffice-$version-mac-x64.dmg\` (Intel). Die \`.zip\`- und \`.tar.gz\`-Archive sind der Server für die Kommandozeile (install.sh, install.ps1)."
          gh release create "$tag" "${dateien[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$tag" --notes "$hinweis" --generate-notes --latest
