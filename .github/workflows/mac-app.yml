name: Mac app

# Baut die Mac-App (desktop/, siehe docs/mac-app.md) auf einem Mac-Runner: die Desktop-Hülle (Rust,
# tao + wry), den Server, die Agenten-CLI und den Browser-Client (dist/) für Apple Silicon und Intel,
# gepackt zu OpenAgenticOffice-<version>-mac-arm64.dmg und OpenAgenticOffice-<version>-mac-x64.dmg.
# Die App wird ad hoc signiert (ohne Apple-Developer-Zertifikat), das braucht Apple Silicon zum Starten.
#
# Jeder Lauf lädt die Disk-Images als Workflow-Artefakt hoch. Auf main ruft ihn der Release-Workflow
# (release.yml) auf und legt sie mit dem Windows-Installer und den Server-Archiven in dasselbe Release
# (v0.1.<Commits auf main>).

on:
  workflow_call:
  pull_request:
    paths:
      - 'crates/**'
      - 'desktop/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/mac-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # die Version zählt die Commits auf main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Browser-Client bauen
        working-directory: crates/client
        run: trunk build --release

      - name: Version
        id: version
        run: |
          basis="$(grep -m1 '^version' desktop/Cargo.toml | sed -E 's/version *= *"([0-9]+\.[0-9]+).*/\1/')"
          echo "version=$basis.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Für Apple Silicon und Intel bauen und packen
        run: |
          for paar in arm64:aarch64-apple-darwin x64:x86_64-apple-darwin; do
            arch="${paar%%:*}"; ziel="${paar##*:}"
            cargo build --release --locked -p server -p agenten --target "$ziel"
            cargo build --release --locked --manifest-path desktop/Cargo.toml --target "$ziel"
            s="desktop/staging-$arch"
            mkdir -p "$s"
            cp "desktop/target/$ziel/release/open-agentic-office-desktop" "$s/"
            cp "target/$ziel/release/open-agentic-office" "$s/"
            for b in office-agenten office-pty-wirt; do cp "target/$ziel/release/$b" "$s/" 2>/dev/null || echo "Hinweis: $b nicht gebaut"; done
            cp -R dist "$s/dist"
            cp -R desktop/claude desktop/tools "$s/"
            bash desktop/build/mac-paket.sh "$s" "${{ steps.version.outputs.version }}" "$arch"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAgenticOffice-mac
          path: desktop/release/*.dmg
          if-no-files-found: error

