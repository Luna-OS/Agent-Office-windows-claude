name: Windows app

# Baut die Windows-App (desktop/, siehe docs/windows-app.md) auf einem Windows-Runner: die Desktop-Hülle
# (Rust, tao + wry), den Server, die Agenten-CLI, den Browser-Client (dist/), die GitHub CLI und die
# Claude-Code-Verknüpfung, gepackt mit NSIS zu OpenAgenticOffice-Setup-<version>.exe.
#
# Jeder Lauf lädt den Installer als Workflow-Artefakt hoch. Ein Push auf main veröffentlicht ihn
# zusätzlich als GitHub-Release (windows-v0.1.<Commits auf main>), neben dem mac-v…-Release der Mac-App.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'desktop/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows-app.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'desktop/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # die Version zählt die Commits auf main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Browser-Client bauen
        working-directory: crates/client
        run: trunk build --release

      - name: Server und Agenten-CLI bauen
        run: cargo build --release --locked -p server -p agenten

      - name: Desktop-Hülle bauen
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml

      - name: Version
        id: version
        run: |
          basis="$(grep -m1 '^version' desktop/Cargo.toml | sed -E 's/version *= *"([0-9]+\.[0-9]+).*/\1/')"
          echo "version=$basis.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ordner zusammenstellen
        run: |
          s=desktop/staging
          mkdir -p "$s/werkzeuge"
          cp desktop/target/release/open-agentic-office-desktop.exe "$s/"
          cp target/release/open-agentic-office.exe "$s/"
          for b in office-agenten office-pty-wirt; do cp "target/release/$b.exe" "$s/" 2>/dev/null || echo "Hinweis: $b nicht gebaut"; done
          cp -R dist "$s/dist"
          cp -R desktop/claude desktop/tools "$s/"
          cp "$(which gh)" "$s/werkzeuge/gh.exe"

      - name: Installer packen
        run: |
          mkdir -p desktop/release
          makensis //DVERSION=${{ steps.version.outputs.version }} //DQUELLE=desktop\\staging desktop/build/installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAgenticOffice-Setup
          path: desktop/release/OpenAgenticOffice-Setup-*.exe
          if-no-files-found: error

      - name: Veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: windows-v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG ist schon veröffentlicht"
            exit 0
          fi
          gh release create "$TAG" desktop/release/OpenAgenticOffice-Setup-*.exe --target "$GITHUB_SHA" --title "Windows-App $TAG" --generate-notes --latest=false
