name: CI

# Prüft jeden Push auf main und jeden Pull Request: Format, Clippy, Tests (inkl. Größen-Wächter
# `cargo test -p pruefungen`) und den Browser-Client mit Trunk.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format prüfen
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Trunk installieren
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Browser-Client bauen
        working-directory: crates/client
        run: trunk build --release
