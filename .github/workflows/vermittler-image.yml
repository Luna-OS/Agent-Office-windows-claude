name: Vermittler image

# Baut den Container des Vermittlers (deploy/vermittler/Dockerfile) für die Umbrel-App
# (deploy/umbrel/agent-office-vermittler, siehe docs/vermittler.md): für amd64 (Umbrel Home, jeder PC)
# und arm64 (Raspberry Pi), jeweils auf einem Runner der passenden Art, ohne Emulation. Ein Push auf
# main veröffentlicht beide als ein Image, ghcr.io/<owner>/agent-office-vermittler:0.1.<Commits auf main>
# und :latest, das deploy/umbrel/publish.sh --app agent-office-vermittler in einen App-Store legt.
# Ein Pull Request baut und prüft beide, veröffentlicht aber nichts.

on:
  push:
    branches: [main]
    paths:
      - 'crates/vermittler/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/vermittler/**'
      - '.github/workflows/vermittler-image.yml'
  pull_request:
    paths:
      - 'crates/vermittler/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/vermittler/**'
      - 'deploy/umbrel/agent-office-vermittler/**'
      - '.github/workflows/vermittler-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vermittler-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image-Name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-office-vermittler" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Auf main nur nach Digest: der Job unten macht aus beiden Plattformen ein Image.
      - name: Bauen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vermittler/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Der Vermittler von Agent Office (die Umbrel-App): vermittelt eine Lobby, ohne selbst zu rechnen
            org.opencontainers.image.licenses=MIT
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) || 'type=docker,name=agent-office-vermittler:ci,dest=/tmp/vermittler-image.tar' }}
          cache-from: type=gha,scope=vermittler-${{ steps.name.outputs.arch }}
          cache-to: type=gha,mode=max,scope=vermittler-${{ steps.name.outputs.arch }}

      # So, wie die Umbrel-App ihn startet: mit Passwort, hinter dem App-Proxy.
      - name: Starten wie die Umbrel-App
        if: env.PUBLISH != 'true'
        run: |
          docker load -i /tmp/vermittler-image.tar
          docker run -d --name vermittler -p 4600:4600 -e VERMITTLER_PASSWORT=ci -e VERMITTLER_HINTER_PROXY=1 agent-office-vermittler:ci
          for _ in $(seq 30); do
            stand=$(curl -fs http://127.0.0.1:4600/vermittler/stand || true)
            [ -n "$stand" ] && break
            sleep 1
          done
          docker logs vermittler
          echo "$stand"
          echo "$stand" | grep -q '"dienst":"agent-office-vermittler"' || { echo "Der Vermittler antwortet nicht auf /vermittler/stand"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' http://127.0.0.1:4600/)
          [ "$code" = 503 ] || { echo "Ohne Gastgeber sollte die Lobby 503 sagen, kam: $code"; exit 1; }
          docker image inspect agent-office-vermittler:ci --format 'Größe: {{.Size}} Bytes'

      - name: Digest merken
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: vermittler-digest-${{ steps.name.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  veroeffentlichen:
    needs: bauen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # die Version zählt die Commits auf main

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: vermittler-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Beide Plattformen als ein Image
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-office-vermittler"
          version="0.1.$(git -C "$GITHUB_WORKSPACE" rev-list --count HEAD)"
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$version"
          {
            echo "### $image:$version"
            echo
            echo 'In deinen Umbrel-App-Store legen:'
            echo
            echo '```sh'
            echo 'deploy/umbrel/publish.sh <dein App-Store> --app agent-office-vermittler --pr'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
