name: Umbrel image

# Baut den Container des Office (deploy/container/Dockerfile, Rust-Mehrstufen-Build) für die Umbrel-App
# (deploy/umbrel, siehe docs/umbrel.md): für amd64 (ein Umbrel Home, jeder PC) und arm64 (ein Raspberry Pi),
# jeweils auf einem Runner der eigenen Art, also ohne Emulation. Ein Push auf main veröffentlicht beide als
# ein Image, ghcr.io/<owner>/open-agentic-office:0.1.<Commits auf main> und :latest, das deploy/umbrel/publish.sh
# in einen Umbrel-App-Store legt. Ein Pull Request baut beide und veröffentlicht nichts.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deploy/container/**'
      - 'deploy/provision.sh'
      - '.github/workflows/umbrel-image.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deploy/container/**'
      - 'deploy/provision.sh'
      - 'deploy/umbrel/**'
      - '.github/workflows/umbrel-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umbrel-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-agentic-office" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Auf main nur per Digest gepusht: der Job „publish“ unten taggt beide Plattformen als ein Image.
      - name: Bauen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/container/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenAgenticOffice, das 3D-Office, das dein Team mit seinen Coding-Agenten teilt (Container der Umbrel-App)
            org.opencontainers.image.licenses=MIT
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) || 'type=docker,name=open-agentic-office:ci,dest=/tmp/office-image.tar' }}
          cache-from: type=gha,scope=umbrel-${{ steps.name.outputs.arch }}
          cache-to: type=gha,mode=max,scope=umbrel-${{ steps.name.outputs.arch }}

      # Das Image so gestartet, wie die Umbrel es startet: auf 0.0.0.0 hinter dem App-Proxy, mit Passwort.
      - name: Starten wie die Umbrel-App
        if: env.PUBLISH != 'true'
        run: |
          docker load -i /tmp/office-image.tar
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name office -p 4600:4600 -v "$RUNNER_TEMP/data:/data" \
            -e OFFICE_HOST=0.0.0.0 -e OFFICE_PASSWORT=ci-passwort open-agentic-office:ci
          code=000
          for _ in $(seq 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/ || true)
            [ "$code" != 000 ] && break
            sleep 2
          done
          docker logs office
          [ "$code" != 000 ] || { echo "Das Office hat auf Port 4600 nicht geantwortet"; exit 1; }

      - name: Digest merken
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ steps.name.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # die Version zählt die Commits auf main

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Beide Plattformen als ein Image taggen
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-agentic-office"
          basis="$(grep -m1 '^version' "$GITHUB_WORKSPACE/Cargo.toml" | sed -E 's/version *= *"([0-9]+\.[0-9]+).*/\1/')"
          version="$basis.$(git -C "$GITHUB_WORKSPACE" rev-list --count HEAD)"
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$version"
          {
            echo "### $image:$version"
            echo
            echo 'In deinen Umbrel-App-Store legst du es so:'
            echo
            echo '```sh'
            echo 'deploy/umbrel/publish.sh <dein App-Store-Checkout> --pr'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
