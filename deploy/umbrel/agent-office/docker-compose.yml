# Agent Office on Umbrel: the container from deploy/container/Dockerfile, behind Umbrel's app proxy.
# No sshd (AGENT_OFFICE_SSHD=off): people reach the office through the proxy on port 4600 of the
# Umbrel, and sign in with the office's own password (Umbrel's deterministic APP_PASSWORD, shown
# on the app's page) or an account of their own. Everything the office keeps is on the app's
# data folder: the password, accounts, floors, projects, Claude's and GitHub's sign-ins.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: agent-office_web_1
      APP_PORT: 4600
      # The office signs people in itself (its password, or accounts), so the lobby works for
      # teammates who don't have the Umbrel's own password.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/luna-os/agent-office:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      AGENT_OFFICE_SSHD: "off"
      AGENT_OFFICE_HOST: 0.0.0.0
      AGENT_OFFICE_TRUST_PROXY: "1"
      AGENT_OFFICE_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data
