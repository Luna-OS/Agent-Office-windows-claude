manifestVersion: 1.1
# deploy/umbrel/publish.sh kopiert diesen Ordner in einen Community-App-Store, als
# <Store-ID>-agent-office-vermittler, mit der ID, der Version und dem Image des neuesten Builds.
id: agent-office-vermittler
category: developer
name: Agent Office Vermittler
version: "0.1.0"
tagline: Der Server für euer Agent Office, immer offen
description: >-
  Agent Office ist ein 3D-Office, das sich dein Team mit seinen Coding-Agents teilt: Claude Code und
  andere Arbeiter sitzen an Schreibtischen, jeder mit seinem Terminal, und jedes GitHub-Repository
  ist eine Etage.


  Diese App ist der Server: Das Office mit seinen Etagen, dem Board und dem Chat läuft hier, solange
  der Umbrel läuft. Keiner muss gastgeben. Jeder verbindet sich in der App „Agent Office“ (Windows
  oder Mac) mit der Adresse dieses Umbrel, dem Passwort unten und seinem Namen; beim ersten Mal legt
  der Server dabei sein Konto an. Die Arbeiter mit ihren Terminals laufen auf dem PC dessen, der sie
  einstellt, mit seinem Claude, und sind trotzdem für alle da.


  Das Passwort unten ist das Passwort des Servers: Gebt es nur Leuten, die mitspielen sollen.
releaseNotes: >-
  Das Office läuft jetzt auf dem Umbrel selbst, immer offen: Keiner muss mehr gastgeben, und es gibt
  keine Einladungslinks mehr. Jeder verbindet sich mit Adresse, Passwort und Namen (App ab 0.1.47).
