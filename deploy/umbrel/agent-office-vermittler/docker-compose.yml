# Agent Office Vermittler auf dem Umbrel: der Server, auf dem euer Office läuft, der Container aus
# deploy/container/Dockerfile hinter dem App-Proxy von Umbrel auf Port 4600. Keiner der Spieler muss
# gastgeben: Das Office ist da, solange der Umbrel läuft. Wer mitspielt, verbindet sich im Connector mit
# der Adresse des Umbrel, dem Passwort des Servers (das APP_PASSWORD der App, auf ihrer Seite zu sehen)
# und seinem Namen. Alles, was das Office behält, liegt im Daten-Ordner der App: Etagen, Konten,
# Board, Chat und die Anmeldungen bei GitHub.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: agent-office-vermittler_web_1
      APP_PORT: 4600
      # Das Office meldet die Spieler selbst an (Name und Passwort des Servers), ohne das Passwort
      # des Umbrel selbst.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/luna-os/agent-office:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      AGENT_OFFICE_SSHD: "off"
      AGENT_OFFICE_HOST: 0.0.0.0
      AGENT_OFFICE_TRUST_PROXY: "1"
      AGENT_OFFICE_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data
