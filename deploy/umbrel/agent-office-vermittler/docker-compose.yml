# Der Vermittler auf dem Umbrel: der Container aus deploy/vermittler/Dockerfile, hinter dem App-Proxy
# von Umbrel auf Port 4600. Das Lobby-Passwort ist das APP_PASSWORD der App (auf ihrer Seite zu
# sehen); nur das Office des Gastgebers braucht es. Der Vermittler speichert nichts.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: agent-office-vermittler_web_1
      APP_PORT: 4600
      # Das Office des Gastgebers meldet die Spieler selbst an, mit seinem Passwort oder Konten.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/luna-os/agent-office-vermittler:latest
    restart: on-failure
    environment:
      VERMITTLER_PASSWORT: ${APP_PASSWORD}
      # Der App-Proxy hängt die Adresse des Browsers an X-Forwarded-For an.
      VERMITTLER_HINTER_PROXY: "1"
