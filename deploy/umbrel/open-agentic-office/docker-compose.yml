# OpenAgenticOffice auf Umbrel: der Container aus deploy/container/Dockerfile hinter Umbrels App-Proxy.
# Kein sshd (OAO_SSHD=off): die Leute erreichen das Office über den Proxy auf Port 4600 des
# Umbrel und melden sich mit dem eigenen Passwort des Office an (Umbrels deterministisches
# APP_PASSWORD, auf der Seite der App angezeigt) oder mit einem eigenen Konto. Alles, was das Office
# behält, liegt im Datenordner der App: Passwort, Konten, Etagen, Projekte, Claude- und GitHub-Anmeldungen.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: open-agentic-office_web_1
      APP_PORT: 4600
      # Das Office meldet die Leute selbst an (Passwort oder Konten), damit die Lobby auch für
      # Mitspieler ohne das Umbrel-Passwort funktioniert.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/luna-os/open-agentic-office:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      OAO_SSHD: "off"
      OAO_HOST: 0.0.0.0
      OAO_TRUST_PROXY: "1"
      OFFICE_PASSWORT: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data
