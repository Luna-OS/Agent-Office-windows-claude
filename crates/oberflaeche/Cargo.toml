[package]
name = "oberflaeche"
description = "Die Oberfläche mit Leptos und rust-ui: HUD, Menüs, Fenster, Terminals."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protokoll.workspace = true
serde.workspace = true
serde_json.workspace = true
medien.workspace = true
leptos = { version = "0.8", features = ["csr"] }
tw_merge = "0.1"
vt100 = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "TextMetrics", "KeyboardEvent", "MouseEvent", "WheelEvent", "ClipboardEvent", "DataTransfer",
  "Storage", "Location", "Headers", "Request", "RequestInit", "RequestCredentials", "Response", "Navigator", "Clipboard",
  "DomRect", "History", "MediaQueryList", "Selection", "DragEvent", "ResizeObserver", "ResizeObserverEntry", "console",
] }
