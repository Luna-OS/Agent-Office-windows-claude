[package]
name = "welt"
description = "Die 3D-Welt mit kiss3d: Gebäude, Etagen, Dachterrasse, Figuren, Bewegung."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protokoll.workspace = true
serde.workspace = true
serde_json.workspace = true
kiss3d = "0.47"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Document", "Element", "HtmlCanvasElement", "console"] }
