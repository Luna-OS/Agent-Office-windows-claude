[package]
name = "ende-zu-ende"
description = "Browser-Tests von OpenAgenticOffice: echter Server, echtes Chromium über das DevTools-Protokoll."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
server = { path = "../server" }
protokoll.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
tempfile = "3"
