[package]
name = "client"
description = "Der Browser-Client (WASM): setzt Welt, Oberfläche und Medien zusammen."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protokoll.workspace = true
welt.workspace = true
oberflaeche.workspace = true
medien.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "console"] }
