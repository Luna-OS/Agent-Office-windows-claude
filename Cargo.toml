[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Luna-OS/OpenAgenticOffice"

[workspace.dependencies]
protokoll = { path = "crates/protokoll" }
agenten = { path = "crates/agenten" }
medien = { path = "crates/medien" }
welt = { path = "crates/welt" }
oberflaeche = { path = "crates/oberflaeche" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
